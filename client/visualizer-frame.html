<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizador</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!--
      Runs on its own, sandboxed and origin-less: MilkDrop presets are compiled
      with `new Function`, so this document needs 'unsafe-eval'. Keeping it out
      of the app's own origin is what lets the application CSP stay strict.
    -->
    <canvas id="stage"></canvas>
    <script type="module" src="/src/visualizerFrame.ts"></script>
  </body>
</html>
